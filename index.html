<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6EC3F4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>O Mistério do Globo das Nações</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff8e7;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: #6ec3f4;
        color: #fff;
        font: 800 32px 'Baloo 2', 'Trebuchet MS', sans-serif;
        text-shadow: 0 3px 0 #2b2a4c;
      }
      /* Celular em pé: o jogo é pensado para a tela deitada. */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint">Gire o aparelho para jogar</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
